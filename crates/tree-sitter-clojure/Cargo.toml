[package]
name = "tree-sitter-clojure"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Vendored tree-sitter Clojure grammar (see README.md for why it is vendored)"
publish = false
# The upstream crate declares `links = "tree-sitter"`; ours must NOT, or it
# would collide with the real tree-sitter. Claiming our own link name keeps a
# second copy of this grammar from ever entering the graph.
links = "tree-sitter-clojure"

[dependencies]
# Deliberately NOT a dependency on `tree-sitter` itself — see README.md. The
# LanguageFn shim is version-stable and is what every other grammar crate in
# the workspace depends on, so a single `tree-sitter` stays unified.
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
# Test-only: exercising the grammar needs a real parser. Must track the
# workspace `tree-sitter` version (a second version would hit the `links`
# collision described in README.md).
tree-sitter = "0.26"
